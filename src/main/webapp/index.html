<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hello Webapp - Images</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; }
    .controls { margin-bottom: 12px; }
    table { border-collapse: collapse; width: 100%; max-width: 640px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
    #preview { margin-top: 12px; max-width: 640px; height: auto; display:block; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h2>Images (S3)</h2>

  <div class="controls">
  <input id="file_input" type="file" accept="image/*" multiple />
    <button id="upload_btn">Upload</button>
    <button id="load_btn">Load images</button>
  </div>

  <table id="images_table">
    <thead>
      <tr><th>Name</th><th>Action</th></tr>
    </thead>
    <tbody id="images_tbody">
      <!-- rows inserted here -->
    </tbody>
  </table>

  <img id="preview" alt="Preview" />

  <script src="scripts.js"></script>
  <script>
    // wire up simple interactions after scripts.js loads
    document.addEventListener('DOMContentLoaded', function () {
      const loadBtn = document.getElementById('load_btn');
      const uploadBtn = document.getElementById('upload_btn');

      loadBtn.addEventListener('click', loadImageList);
      uploadBtn.addEventListener('click', handleUpload);

      // load once on page open
      loadImageList();
    });
  </script>
</body>
</html>
